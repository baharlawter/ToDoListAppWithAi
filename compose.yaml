services:
  mysql:
    image: mysql:8.4
    container_name: daylight-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: daylight
      MYSQL_USER: daylight
      MYSQL_PASSWORD: daylight_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
