spring.application.name=todo-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/daylight?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:daylight}
spring.datasource.password=${DB_PASSWORD:daylight_local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
